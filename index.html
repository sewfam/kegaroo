<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>k e g a r o o</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            margin-top: 20px;
        }
        img {
            width: 300px;
            max-width: 90%;
        }
        .description {
            font-size: 18px;
            margin: 10px 0;
        }
        .date {
            font-size: 22px;
            font-weight: bold;
            color: #ff6600;
        }
        .countdown {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
        .button {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #ff6600;
            text-decoration: none;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #e05500;
        }
        .instagram {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }
        .instagram a {
            color: #555;
            text-decoration: none;
        }
        .instagram a:hover {
            color: #ff6600;
        }
    </style>
</head>
<body>
    <header>
        <img src="simple.png" alt="Kegaroo Logo">
    </header>
    <main>
        <p class="description">4th annual sunrise kegger + DJ at Palisades Tahoe</p>
        <p class="date">January 19th, 2025</p>
        <div id="countdown" class="countdown">Loading countdown...</div>
        <a href="https://partiful.com/e/OAN656SVrDfkZGMQWXPw" class="button" target="_blank">RSVP on Partiful</a>
        <a href="https://www.amazon.com/Plush-Kangaroo-Piece-Animal-Costume/dp/B0145JUBPK" class="button" target="_blank">Purchase a Kangaroo Onesie</a>
    </main>
    <footer>
        <p class="instagram">Follow us on Instagram: <a href="https://www.instagram.com/kegaroooo/" target="_blank">@kegaroooo</a></p>
    </footer>

    <script>
        // Countdown Timer Script
        const eventDate = new Date('January 19, 2025 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = eventDate - now;

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;

            if (timeLeft < 0) {
                document.getElementById('countdown').innerText = "The event has started!";
            }
        }

        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
